<div class="airplane-bg-wrapper">
  <div class="bg-overlay"></div>

  <!-- Global Toast Alerts -->
  <div class="toast-container" *ngIf="userService.successMessage() || userService.errorMessage()">
    <div *ngIf="userService.successMessage()" class="toast toast-success">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
      <span>{{ userService.successMessage() }}</span>
      <button type="button" class="toast-close" (click)="userService.clearNotifications()">&times;</button>
    </div>

    <div *ngIf="userService.errorMessage()" class="toast toast-error">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ userService.errorMessage() }}</span>
      <button type="button" class="toast-close" (click)="userService.clearNotifications()">&times;</button>
    </div>
  </div>

  <div class="main-shell">
    
    <!-- Top Floating Header Pill: Blended with Airplane Sky -->
    <header class="floating-header">
      <div class="brand-crest">
        <span class="crest-logo">Jet✈</span>
        <div class="brand-text">
          <h1>DOMIER AERO PORTAL</h1>
          
        </div>
      </div>

      <!-- Live API Status Indicator -->
      <button
        type="button"
        class="api-status-pill"
        [class.connected]="userService.isApiConnected()"
        [class.fallback]="userService.isUsingLocalFallback()"
        (click)="openApiConfig()"
        title="Configure .NET API Endpoint URL"
      >
        <span class="pulse-dot"></span>
        <span class="status-name">{{ userService.isApiConnected() ? '.NET API Online' : 'Local Cache Mode' }}</span>
        <svg class="gear" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- TWO-TAB NAVIGATION BAR BLENDED WITH THE AIRPLANE PHOTO -->
    <nav class="blended-tabs-nav" aria-label="Two Tab Interface">
      
      <!-- Tab 1: Registration Form -->
      <button
        type="button"
        class="tab-glass-btn"
        [class.active]="userService.activeTab() === 'form'"
        (click)="userService.setActiveTab('form')"
      >
        <div class="tab-btn-inner">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <line x1="19" y1="8" x2="19" y2="14"></line>
            <line x1="22" y1="11" x2="16" y2="11"></line>
          </svg>
          <div class="tab-titles">
            <span class="tab-num">TAB 1</span>
            <span class="tab-name">Passenger Registration Form</span>
          </div>
        </div>
        <span *ngIf="userService.selectedUserForEdit()" class="badge-edit-pill">
          Editing ID #{{ userService.selectedUserForEdit()?.id }}
        </span>
      </button>

      <!-- Tab 2: User Records / Data View -->
      <button
        type="button"
        class="tab-glass-btn"
        [class.active]="userService.activeTab() === 'list'"
        (click)="userService.setActiveTab('list')"
      >
        <div class="tab-btn-inner">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <div class="tab-titles">
            <span class="tab-num">TAB 2</span>
            <span class="tab-name">User Records &amp; Directory</span>
          </div>
        </div>
        <span class="badge-count-pill">
          {{ userService.users().length }} Records
        </span>
      </button>

    </nav>

    <!-- CONTENT PANELS: BLENDED WITH AIRPLANE BACKGROUND -->
    <main class="blended-content-card">
      
      <!-- TAB 1 CONTENT -->
      <section *ngIf="userService.activeTab() === 'form'" class="tab-fade">
        <app-user-form></app-user-form>
      </section>

      <!-- TAB 2 CONTENT -->
      <section *ngIf="userService.activeTab() === 'list'" class="tab-fade">
        <app-user-list></app-user-list>
      </section>

    </main>

  </div>

  <!-- API URL CONFIGURATION MODAL -->
  <div *ngIf="isApiConfigOpen()" class="modal-backdrop" (click)="closeApiConfig()">
    <div class="modal-card config-modal" (click)="$event.stopPropagation()">
      <div class="config-modal-header">
        <div class="config-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
            <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
            <line x1="6" y1="6" x2="6.01" y2="6"></line>
            <line x1="6" y1="18" x2="6.01" y2="18"></line>
          </svg>
        </div>
        <div>
          <h3>.NET API Endpoint Configuration</h3>
          <p class="config-sub">Configure the REST API base URL for POST, GET, PUT &amp; DELETE operations</p>
        </div>
      </div>

      <div class="config-input-group">
        <label for="apiUrlInput">API Endpoint URL:</label>
        <input
          id="apiUrlInput"
          type="text"
          [ngModel]="customApiUrlInput()"
          (ngModelChange)="customApiUrlInput.set($event)"
          placeholder="http://localhost:5000/api/users"
          class="url-input"
        />
      </div>

      <div class="presets-section">
        <span class="presets-label">Common Localhost Presets:</span>
        <div class="presets-pills">
          <button type="button" class="preset-pill" (click)="resetApiToDefault('http://localhost:5000/api/users')">
            http://localhost:5000/api/users
          </button>
          <button type="button" class="preset-pill" (click)="resetApiToDefault('https://localhost:7123/api/users')">
            https://localhost:7123/api/users
          </button>
          <button type="button" class="preset-pill" (click)="resetApiToDefault('http://localhost:5242/api/users')">
            http://localhost:5242/api/users
          </button>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-modal-cancel" (click)="closeApiConfig()">Cancel</button>
        <button type="button" class="btn-primary" (click)="saveApiConfig()">Save &amp; Test Connection</button>
      </div>
    </div>
  </div>

</div>
